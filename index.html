<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Proyecto Ruah - Sistema Modular</title>
  <link rel="icon" type="image/png" href="https://wwtsegyxdodfhqzpgajn.supabase.co/storage/v1/object/public/proyecto-ruah/Ruah%20logo.png"> 
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 1. CONFIGURACIÓN Y CONSTANTES
    // ==========================================
    const SUPABASE_URL = "https://wwtsegyxdodfhqzpgajn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dHNlZ3l4ZG9kZmhxenBnYWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTY3NzgsImV4cCI6MjEwMTA5Mjc3OH0.MDb_sVu5vKsdXjL7jm22hO1uXksCZWlYEstBIKO98Cs";
    const CLAVE_ADMIN = "ruah2026";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const URLS_VOLUNTARIOS = [
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vSC1qCHZrURes_1bVKlr6nnrMNLXqkj50J6hjH9TvpVsySpnNq5REvgcbUQfXZqFob_jQ8uT_A2Y2qt/pub?output=csv',
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHqdXWibNn84wo0MOkfBJZpaA9sbXyC_Y_fMsNADcinC1XD6iQL2X38PwBi2Y-kimdmio1p6kDbM0P/pub?output=csv',
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vRMgDgHLQJ4Vu3LWoKTWUREc6N1C3eAw1yjvFLqIYNGp21waqHJaECritHXj-mi7sVYrBMV7OmIbdUM/pub?output=csv',
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2OU1pvEKVDzEFEe4i58GB2JmxwL3M7q_nZCLKJo1jLM5xKiImVba1YufKLS1QC0M2ARz11FLVdVUT/pub?output=csv'
    ];

    const Helpers = {
      calcularTiempo: (fecha) => {
        if (!fecha) return 'Reciente';
        const inicio = new Date(fecha);
        const ahora = new Date();
        const difMs = ahora - inicio;
        const min = Math.floor(difMs / 60000);
        const hrs = Math.floor(min / 60);
        const dias = Math.floor(hrs / 24);
        if (dias > 0) return `${dias} d y ${hrs % 24} h`;
        if (hrs > 0) return `${hrs} h y ${min % 60} m`;
        return `${Math.max(1, min)} min`;
      },
      validarVoluntario: async (nombre, apellido) => {
        const nom = nombre.toLowerCase().trim();
        const ape = apellido ? apellido.toLowerCase().trim() : '';
        for (const url of URLS_VOLUNTARIOS) {
          try {
            const res = await fetch(url);
            const texto = (await res.text()).toLowerCase();
            if (texto.includes(nom) && (ape === '' || texto.includes(ape))) return true;
          } catch (e) { console.error("Error validando:", e); }
        }
        return false;
      }
    };

    // ==========================================
    // 2. CAPA DE DATOS (RuahAPI)
    // ==========================================
    const RuahAPI = {
      tickets: {
        fetch: async () => {
          const { data } = await db.from('tickets').select('*').order('created_at', { ascending: false });
          return data || [];
        },
        updateEstado: async (id, estado) => await db.from('tickets').update({ estado }).eq('id', id),
        save: async (ticket) => await db.from('tickets').insert([ticket])
      },
      inventario: {
        fetch: async () => {
          const { data } = await db.from('inventario').select('*');
          return data || [];
        },
        save: async (item) => await db.from('inventario').insert([item]),
        delete: async (id) => await db.from('inventario').delete().eq('id', id)
      },
      comunidades: {
        fetch: async () => {
          const { data } = await db.from('comunidades').select('*').order('nombre_comunidad', { ascending: true });
          return data || [];
        },
        save: async (comu) => await db.from('comunidades').insert([comu]),
        updateCenso: async (id, censo) => await db.from('comunidades').update(censo).eq('id', id)
      },
      necesidades: {
        fetch: async (comuId) => {
          const { data } = await db.from('necesidades').select('*').eq('comunidad_id', comuId).order('created_at', { ascending: false });
          return data || [];
        },
        save: async (nece) => await db.from('necesidades').insert([nece]),
        colaborar: async (id, colab) => await db.from('necesidades').update({ colaborador: colab }).eq('id', id)
      }
    };

    // ==========================================
    // 3. COMPONENTES DE INTERFAZ (UI)
    // ==========================================
    
    const TicketCard = ({ t, esAdmin, onCambiarEstado }) => (
      <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 space-y-2">
        <div className="flex justify-between items-start">
          <span className="text-[10px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">{t.departamento}</span>
          <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${t.fue_verificado === 'Sí' ? 'bg-emerald-100 text-emerald-800' : 'bg-gray-100 text-gray-600'}`}>
            {t.fue_verificado === 'Sí' ? '✓ Verificado' : 'Sin verificar'}
          </span>
        </div>
        <h4 className="font-bold text-sm text-gray-800">{t.situacion_caso || t.comunidad}</h4>
        <p className="text-xs text-gray-500 font-medium">📍 {t.comunidad}</p>
        <p className="text-xs text-gray-600 bg-gray-50 p-2 rounded">{t.descripcion}</p>
        <div className="text-[11px] font-medium text-amber-800 bg-amber-50 px-2 py-1 rounded border border-amber-200/60 w-fit">
          ⏱️ {Helpers.calcularTiempo(t.created_at)}
        </div>
        {esAdmin && (
          <div className="pt-2 flex flex-wrap gap-1 border-t">
            {['Por revisión', 'Atendiendo', 'Entregado'].map(est => (
              t.estado !== est && <button key={est} onClick={() => onCambiarEstado(t.id, est)} className="text-[10px] bg-gray-100 px-2 py-1 rounded hover:bg-gray-200">{est}</button>
            ))}
          </div>
        )}
      </div>
    );

    const ComunidadCard = ({ c, onNecesidades, onEditarCenso }) => (
      <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div className="p-5 border-b bg-slate-50 flex justify-between items-center">
          <h3 className="font-bold text-lg text-slate-800">{c.nombre_comunidad}</h3>
          <button onClick={() => onEditarCenso(c)} className="text-[10px] bg-white border border-blue-200 text-blue-600 px-2 py-1 rounded font-bold hover:bg-blue-50 transition">✏️ Editar Censo</button>
        </div>
        <div className="p-5 space-y-4">
          <div className="grid grid-cols-2 gap-4 text-xs text-gray-500">
            <div><p className="font-bold uppercase text-[9px]">Representante</p><p className="text-slate-800">{c.nombre_representante} ({c.telefono_rep})</p></div>
            <div><p className="font-bold uppercase text-[9px]">Encargado Ruah</p><p className="text-slate-800">{c.nombre_encargado_ruah}</p></div>
          </div>
          <div className="bg-gray-50 p-3 rounded-lg border border-gray-100 grid grid-cols-3 gap-2 text-center">
            <div className="p-1 text-[10px]"><p className="text-gray-400">Niños</p><p className="font-bold">{c.ninos || 0}</p></div>
            <div className="p-1 text-[10px]"><p className="text-gray-400">Adultos</p><p className="font-bold">{c.adultos || 0}</p></div>
            <div className="p-1 text-[10px]"><p className="text-gray-400">Embar.</p><p className="font-bold">{c.embarazadas || 0}</p></div>
          </div>
          <button onClick={() => onNecesidades(c)} className="w-full py-2 bg-slate-800 text-white rounded-lg text-sm font-semibold hover:bg-slate-900 transition shadow-sm">📋 Lista de Necesidades</button>
        </div>
      </div>
    );

    // ==========================================
    // 4. APLICACIÓN PRINCIPAL
    // ==========================================
    function App() {
      const [seccion, setSeccion] = useState('home');
      const [data, setData] = useState({ tickets: [], inventario: [], comunidades: [] });
      const [cargando, setCargando] = useState(false);
      const [esAdmin, setEsAdmin] = useState(false);
      const [modales, setModales] = useState({ login: false, ticket: false, comunidad: false, censo: false, necesidades: false });
      
      const [fechaFiltro, setFechaFiltro] = useState(() => new Date().toISOString().split('T')[0]);
      const [selección, setSelección] = useState({ comu: null, nece: [], acti: null });
      const [vistaNece, setVistaNece] = useState('ver');

      // Carga de datos
      const refresh = async () => {
        setCargando(true);
        const [t, i, c] = await Promise.all([RuahAPI.tickets.fetch(), RuahAPI.inventario.fetch(), RuahAPI.comunidades.fetch()]);
        setData({ tickets: t, inventario: i, comunidades: c });
        setCargando(false);
      };

      useEffect(() => { refresh(); }, [seccion]);

      // Handlers
      const handleLogin = (pass) => {
        if (pass === CLAVE_ADMIN) { setEsAdmin(true); setModales({...modales, login: false}); }
        else alert("Clave incorrecta");
      };

      const handleSaveTicket = async (ticket) => {
        setCargando(true);
        const registrado = await Helpers.validarVoluntario(ticket.nombre_voluntario, ticket.apellido_voluntario);
        if (!registrado) {
          alert("No apareces registrado como voluntario.");
          setCargando(false);
          return;
        }
        await RuahAPI.tickets.save(ticket);
        setModales({...modales, ticket: false});
        refresh();
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* BARRA LATERAL */}
          <aside className="w-full md:w-64 bg-slate-900 text-white p-6 flex-shrink-0 flex flex-col justify-between">
            <div className="space-y-8">
              <div className="flex items-center gap-3">
                <img src="https://wwtsegyxdodfhqzpgajn.supabase.co/storage/v1/object/public/proyecto-ruah/Ruah%20logo.png" className="w-10 h-10 rounded-full" />
                <h1 className="text-xl font-bold text-blue-400">Proyecto Ruah</h1>
              </div>
              <nav className="space-y-2">
                {['home', 'comunidades', 'tickets', 'inventario'].map(s => (
                  <button key={s} onClick={() => setSeccion(s)} className={`w-full text-left px-4 py-3 rounded-lg capitalize ${seccion === s ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>
                    {s === 'home' ? '🏠 Home' : s === 'comunidades' ? '📍 Comunidades' : s === 'tickets' ? '🎟️ Tickets' : '📦 Inventario'}
                  </button>
                ))}
              </nav>
            </div>
            <div className="pt-6 border-t border-slate-800">
              {esAdmin ? <div className="text-center text-xs text-emerald-400">Admin Activo</div> : 
              <button onClick={() => setModales({...modales, login: true})} className="w-full text-xs text-slate-400 py-2">🔒 Acceso Admin</button>}
            </div>
          </aside>

          {/* CONTENIDO */}
          <main className="flex-1 p-6 md:p-10 relative">
            {cargando && <div className="absolute top-4 right-10 text-xs text-blue-600 font-bold animate-pulse">Cargando...</div>}
            
            {seccion === 'home' && (
              <div className="max-w-4xl bg-white p-8 rounded-xl shadow-sm border">
                <h2 className="text-3xl font-bold text-slate-800 mb-4">Bienvenidos</h2>
                <p className="text-gray-600">Fundación Ruah: Servicio voluntario y transparente.</p>
              </div>
            )}

            {seccion === 'comunidades' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold">Comunidades</h2>
                  {esAdmin && <button onClick={() => setModales({...modales, comunidad: true})} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">+ Nueva Comunidad</button>}
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {data.comunidades.map(c => (
                    <ComunidadCard key={c.id} c={c} 
                      onEditarCenso={(com) => { setSelección({...selección, comu: com}); setModales({...modales, censo: true}); }}
                      onNecesidades={async (com) => { 
                        setSelección({...selección, comu: com}); 
                        const n = await RuahAPI.necesidades.fetch(com.id);
                        setSelección(prev => ({...prev, nece: n, comu: com}));
                        setModales({...modales, necesidades: true}); setVistaNece('ver');
                      }} 
                    />
                  ))}
                </div>
              </div>
            )}

            {seccion === 'tickets' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold">Tickets y Casos</h2>
                  <button onClick={() => setModales({...modales, ticket: true})} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">+ Registrar Caso</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {['Por revisión', 'Atendiendo', 'Entregado'].map(est => (
                    <div key={est} className="bg-gray-50 p-4 rounded-xl border">
                      <h3 className="font-bold mb-4 text-xs uppercase text-gray-500">{est}</h3>
                      <div className="space-y-3">
                        {data.tickets.filter(t => t.estado === est).map(t => <TicketCard key={t.id} t={t} esAdmin={esAdmin} onCambiarEstado={async (id, e) => { await RuahAPI.tickets.updateEstado(id, e); refresh(); }} />)}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* MODAL LOGIN */}
            {modales.login && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-xs text-center">
                  <h3 className="font-bold mb-4">Acceso Admin</h3>
                  <input type="password" id="adminPass" className="w-full border rounded p-2 mb-4 text-center" placeholder="Clave" />
                  <div className="flex gap-2">
                    <button onClick={() => setModales({...modales, login: false})} className="flex-1 text-gray-400">Cerrar</button>
                    <button onClick={() => handleLogin(document.getElementById('adminPass').value)} className="flex-1 bg-slate-900 text-white py-2 rounded">Entrar</button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL NUEVA COMUNIDAD (Solo Admin) */}
            {modales.comunidad && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md my-8">
                  <h3 className="font-bold text-xl mb-4">Nueva Comunidad</h3>
                  <form onSubmit={async (e) => {
                    e.preventDefault();
                    const form = new FormData(e.target);
                    const comu = Object.fromEntries(form.entries());
                    await RuahAPI.comunidades.save(comu);
                    setModales({...modales, comunidad: false}); refresh();
                  }} className="space-y-3">
                    <input name="nombre_comunidad" required placeholder="Nombre Comunidad" className="w-full border rounded p-2 text-sm" />
                    <input name="nombre_representante" required placeholder="Representante" className="w-full border rounded p-2 text-sm" />
                    <input name="telefono_rep" required placeholder="Teléfono Rep." className="w-full border rounded p-2 text-sm" />
                    <input name="nombre_encargado_ruah" required placeholder="Encargado Ruah" className="w-full border rounded p-2 text-sm" />
                    <div className="flex gap-2 justify-end pt-2">
                      <button type="button" onClick={() => setModales({...modales, comunidad: false})} className="text-gray-400 px-4">Cancelar</button>
                      <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Registrar</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL EDITAR CENSO */}
            {modales.censo && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
                  <h3 className="font-bold mb-4">Editar Censo: {selección.comu?.nombre_comunidad}</h3>
                  <form onSubmit={async (e) => {
                    e.preventDefault();
                    const form = new FormData(e.target);
                    const censo = Object.fromEntries(form.entries());
                    await RuahAPI.comunidades.updateCenso(selección.comu.id, censo);
                    setModales({...modales, censo: false}); refresh();
                  }} className="grid grid-cols-2 gap-3">
                    {['adultos', 'ninos', 'embarazadas', 'adolescentes', 'bebes', 'adultos_mayores'].map(f => (
                      <div key={f}><label className="text-[10px] uppercase font-bold text-gray-400">{f.replace('_',' ')}</label>
                      <input name={f} type="number" defaultValue={selección.comu?.[f] || 0} className="w-full border rounded p-1 text-sm" /></div>
                    ))}
                    <div className="col-span-2 pt-4 flex gap-2">
                      <button type="button" onClick={() => setModales({...modales, censo: false})} className="flex-1 text-gray-400">Volver</button>
                      <button type="submit" className="flex-1 bg-blue-600 text-white py-2 rounded font-bold">Actualizar</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL NECESIDADES */}
            {modales.necesidades && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                  <div className="p-4 bg-slate-900 text-white flex justify-between">
                    <h3 className="font-bold text-sm">Necesidades: {selección.comu?.nombre_comunidad}</h3>
                    <button onClick={() => setModales({...modales, necesidades: false})}>&times;</button>
                  </div>
                  <div className="flex border-b text-xs font-bold bg-gray-50">
                    <button onClick={() => setVistaNece('ver')} className={`flex-1 py-3 ${vistaNece === 'ver' ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}>Ver Lista</button>
                    <button onClick={() => setVistaNece('agregar')} className={`flex-1 py-3 ${vistaNece === 'agregar' ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}>+ Agregar</button>
                  </div>
                  <div className="p-4 max-h-[400px] overflow-y-auto">
                    {vistaNece === 'ver' ? (
                      <div className="space-y-3">
                        {selección.nece.map(n => (
                          <div key={n.id} className="p-3 border rounded-lg bg-gray-50 flex justify-between items-center">
                            <div><p className="font-bold text-sm">{n.insumo}</p><p className="text-[10px] text-gray-400">Para: {n.nombre_persona}</p></div>
                            {!n.colaborador ? <button onClick={() => { setSelección({...selección, acti: n}); setVistaNece('colaborar'); }} className="text-[10px] bg-blue-600 text-white px-2 py-1 rounded">Colaborar</button> : <span className="text-[9px] font-bold text-emerald-600">Asignado</span>}
                          </div>
                        ))}
                      </div>
                    ) : vistaNece === 'agregar' ? (
                      <form onSubmit={async (e) => {
                        e.preventDefault();
                        const n = { insumo: e.target.insumo.value, nombre_persona: e.target.nombre.value, comunidad_id: selección.comu.id };
                        await RuahAPI.necesidades.save(n);
                        const list = await RuahAPI.necesidades.fetch(selección.comu.id);
                        setSelección({...selección, nece: list}); setVistaNece('ver');
                      }} className="space-y-3">
                        <input name="insumo" required placeholder="Insumo" className="w-full border rounded p-2 text-sm" />
                        <input name="nombre" required placeholder="Beneficiario" className="w-full border rounded p-2 text-sm" />
                        <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold">Guardar</button>
                      </form>
                    ) : (
                      <form onSubmit={async (e) => {
                        e.preventDefault();
                        const c = { nombre: e.target.nom.value, tel: e.target.tel.value };
                        await RuahAPI.necesidades.colaborar(selección.acti.id, c);
                        const list = await RuahAPI.necesidades.fetch(selección.comu.id);
                        setSelección({...selección, nece: list}); setVistaNece('ver');
                      }} className="space-y-3">
                        <input name="nom" required placeholder="Tu Nombre" className="w-full border rounded p-2 text-sm" />
                        <input name="tel" required placeholder="Tu Teléfono" className="w-full border rounded p-2 text-sm" />
                        <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded font-bold">Confirmar</button>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* MODAL TICKET */}
            {modales.ticket && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                <div className="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg my-8">
                  <h3 className="font-bold text-xl border-b pb-2 mb-4">Nuevo Ticket</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const f = new FormData(e.target);
                    handleSaveTicket(Object.fromEntries(f.entries()));
                  }} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2 bg-gray-50 p-2 rounded border">
                      <input name="nombre_voluntario" required placeholder="Nombre Voluntario" className="p-2 border rounded text-sm" />
                      <input name="apellido_voluntario" placeholder="Apellido Voluntario" className="p-2 border rounded text-sm" />
                    </div>
                    <input name="situacion_caso" required placeholder="Situación / Título" className="w-full p-2 border rounded text-sm" />
                    <input name="comunidad" required placeholder="Lugar / Comunidad" className="w-full p-2 border rounded text-sm" />
                    <textarea name="descripcion" required placeholder="Descripción del caso..." className="w-full p-2 border rounded text-sm" rows="3" />
                    <div className="flex gap-2 justify-end border-t pt-4">
                      <button type="button" onClick={() => setModales({...modales, ticket: false})} className="text-gray-400 px-4">Cerrar</button>
                      <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Guardar Ticket</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
