<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- DESACTIVAR CACHÉ DEL NAVEGADOR -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Proyecto Ruah</title>
  <link rel="icon" type="image/png" href="https://wwtsegyxdodfhqzpgajn.supabase.co/storage/v1/object/public/proyecto-ruah/Ruah%20logo.png"> 
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React y Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://wwtsegyxdodfhqzpgajn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dHNlZ3l4ZG9kZmhxenBnYWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTY3NzgsImV4cCI6MjEwMTA5Mjc3OH0.MDb_sVu5vKsdXjL7jm22hO1uXksCZWlYEstBIKO98Cs";
    const CLAVE_ADMIN = "ruah2026";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const calcularTiempoTranscurrido = (fechaCreacion) => {
      if (!fechaCreacion) return 'Reciente';
      const inicio = new Date(fechaCreacion);
      const ahora = new Date();
      const difMs = ahora - inicio;
      const minutos = Math.floor(difMs / (1000 * 60));
      const horas = Math.floor(difMs / (1000 * 60 * 60));
      const dias = Math.floor(horas / 24);
      if (dias > 0) return `${dias} d y ${horas % 24} h`;
      if (horas > 0) return `${horas} h y ${minutos % 60} m`;
      return `${Math.max(1, minutos)} min`;
    };

    function App() {
      const [seccion, setSeccion] = useState('home');
      const [tickets, setTickets] = useState([]);
      const [inventario, setInventario] = useState([]);
      const [comunidades, setComunidades] = useState([]);
      const [cargando, setCargando] = useState(false);
      const [mostrarModal, setMostrarModal] = useState(false);
      const [mostrarModalComunidad, setMostrarModalComunidad] = useState(false);
      const [mostrarModalNecesidades, setMostrarModalNecesidades] = useState(false);
      
      const [esAdmin, setEsAdmin] = useState(false);
      const [mostrarLoginAdmin, setMostrarLoginAdmin] = useState(false);
      const [passInput, setPassInput] = useState('');

      // Estados para Comunidades y Necesidades
      const [comunidadSeleccionada, setComunidadSeleccionada] = useState(null);
      const [vistaNecesidades, setVistaNecesidades] = useState('menu'); // menu, ver, agregar, colaborar
      const [necesidades, setNecesidades] = useState([]);
      const [necesidadActiva, setNecesidadActiva] = useState(null);

      const [nuevaComunidad, setNuevaComunidad] = useState({
        nombre_representante: '', cedula: '', telefono_rep: '', nombre_encargado_ruah: '', telefono_encargado: '',
        nombre_comunidad: '', direccion: '', mapa_url: '',
        adultos: 0, adultos_mayores: 0, ninos: 0, adolescentes: 0, embarazadas: 0, bebes: 0, casos_especificos: ''
      });

      const [nuevaNecesidad, setNuevaNecesidad] = useState({ insumo: '', nombre_persona: '', nota: '' });
      const [colaborador, setColaborador] = useState({ nombre: '', telefono: '', es_voluntario: 'No' });

      useEffect(() => {
        if (seccion === 'tickets') obtenerTickets();
        if (seccion === 'inventario') obtenerInventario();
        if (seccion === 'comunidades') obtenerComunidades();
      }, [seccion]);

      const obtenerTickets = async () => { setCargando(true); const { data } = await db.from('tickets').select('*').order('created_at', { ascending: false }); setTickets(data || []); setCargando(false); };
      const obtenerInventario = async () => { setCargando(true); const { data } = await db.from('inventario').select('*'); setInventario(data || []); setCargando(false); };
      const obtenerComunidades = async () => { setCargando(true); const { data } = await db.from('comunidades').select('*').order('nombre_comunidad', { ascending: true }); setComunidades(data || []); setCargando(false); };

      const obtenerNecesidades = async (id) => {
        const { data } = await db.from('necesidades').select('*').eq('comunidad_id', id).order('created_at', { ascending: false });
        setNecesidades(data || []);
      };

      const guardarComunidad = async (e) => {
        e.preventDefault();
        const { error } = await db.from('comunidades').insert([nuevaComunidad]);
        if (error) alert(error.message);
        else { setMostrarModalComunidad(false); obtenerComunidades(); }
      };

      const guardarNecesidad = async (e) => {
        e.preventDefault();
        const { error } = await db.from('necesidades').insert([{ ...nuevaNecesidad, comunidad_id: comunidadSeleccionada.id, colaborador: null }]);
        if (error) alert(error.message);
        else { setVistaNecesidades('ver'); obtenerNecesidades(comunidadSeleccionada.id); }
      };

      const registrarColaboracion = async (e) => {
        e.preventDefault();
        const { error } = await db.from('necesidades').update({ colaborador: colaborador }).eq('id', necesidadActiva.id);
        if (error) alert(error.message);
        else { setVistaNecesidades('ver'); obtenerNecesidades(comunidadSeleccionada.id); }
      };

      const loginAdmin = (e) => {
        e.preventDefault();
        if (passInput === CLAVE_ADMIN) { setEsAdmin(true); setMostrarLoginAdmin(false); setPassInput(''); }
        else alert("Contraseña incorrecta");
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* Menú Lateral */}
          <aside className="w-full md:w-64 bg-slate-900 text-white p-6 flex-shrink-0 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <img src="https://wwtsegyxdodfhqzpgajn.supabase.co/storage/v1/object/public/proyecto-ruah/Ruah%20logo.png" alt="Logo" className="w-10 h-10 rounded-full object-cover border border-slate-700" />
                <div>
                  <h1 className="text-xl font-bold tracking-wider text-blue-400 leading-none">Proyecto Ruah</h1>
                  <p className="text-[11px] text-slate-400 mt-1">Gestión de Voluntariado</p>
                </div>
              </div>
              <nav className="space-y-2">
                <button onClick={() => setSeccion('home')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'home' ? 'bg-blue-600 font-semibold' : 'hover:bg-slate-800'}`}>🏠 Home</button>
                <button onClick={() => setSeccion('comunidades')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'comunidades' ? 'bg-blue-600 font-semibold' : 'hover:bg-slate-800'}`}>📍 Comunidades</button>
                <button onClick={() => setSeccion('tickets')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'tickets' ? 'bg-blue-600 font-semibold' : 'hover:bg-slate-800'}`}>🎟️ Tickets</button>
                <button onClick={() => setSeccion('inventario')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'inventario' ? 'bg-blue-600 font-semibold' : 'hover:bg-slate-800'}`}>📦 Inventario</button>
              </nav>
            </div>
            <div className="pt-6 border-t border-slate-800 mt-6">
              {esAdmin ? (
                <div className="bg-emerald-900/50 p-3 rounded text-center border border-emerald-500/30">
                  <span className="text-xs text-emerald-400 font-medium block">Modo Admin Activo</span>
                  <button onClick={() => setEsAdmin(false)} className="text-[10px] text-gray-400 underline block mx-auto mt-2">Cerrar Sesión</button>
                </div>
              ) : (
                <button onClick={() => setMostrarLoginAdmin(true)} className="w-full text-xs text-slate-400 hover:text-white py-2 text-center transition">🔒 Acceso Admin</button>
              )}
            </div>
          </aside>

          {/* Contenido Principal */}
          <main className="flex-1 p-6 md:p-10 relative">
            
            {/* HOME */}
            {seccion === 'home' && (
              <div className="max-w-4xl space-y-8">
                <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
                  <h2 className="text-3xl font-bold text-slate-800 mb-4">¡Bienvenidos a Fundación Ruah!</h2>
                  <p className="text-gray-600 leading-relaxed mb-6">Atendiendo las necesidades de nuestras comunidades mediante voluntariado transparente.</p>
                  <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r mb-8">
                    <p className="italic text-blue-900 font-medium">"Y el Rey les dirá: En verdad os digo que en cuanto lo hicisteis a uno de estos mis hermanos más pequeños, a mí lo hicisteis."</p>
                    <span className="text-xs font-semibold text-blue-700 block mt-2">— Mateo 25:40</span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onClick={() => setSeccion('comunidades')} className="p-6 bg-slate-50 border border-gray-200 rounded-xl hover:shadow-md transition text-left group">
                      <div className="text-2xl mb-2 group-hover:scale-110 transition-transform">📍</div>
                      <div className="font-bold text-slate-800">Comunidades</div>
                      <div className="text-xs text-gray-500">Censo y necesidades</div>
                    </button>
                    <button onClick={() => setSeccion('tickets')} className="p-6 bg-slate-50 border border-gray-200 rounded-xl hover:shadow-md transition text-left group">
                      <div className="text-2xl mb-2 group-hover:scale-110 transition-transform">🎟️</div>
                      <div className="font-bold text-slate-800">Tickets</div>
                      <div className="text-xs text-gray-500">Casos en curso</div>
                    </button>
                    <button onClick={() => setSeccion('inventario')} className="p-6 bg-slate-50 border border-gray-200 rounded-xl hover:shadow-md transition text-left group">
                      <div className="text-2xl mb-2 group-hover:scale-110 transition-transform">📦</div>
                      <div className="font-bold text-slate-800">Inventario</div>
                      <div className="text-xs text-gray-500">Insumos actuales</div>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* COMUNIDADES */}
            {seccion === 'comunidades' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold text-slate-800">Gestión de Comunidades</h2>
                  {esAdmin && (
                    <button onClick={() => setMostrarModalComunidad(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm">
                      + Agregar Comunidad
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {comunidades.map(c => (
                    <div key={c.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                      <div className="p-5 border-b bg-slate-50 flex justify-between items-center">
                        <h3 className="font-bold text-lg text-slate-800">{c.nombre_comunidad}</h3>
                        <span className="text-[10px] bg-blue-100 text-blue-800 px-2 py-1 rounded font-bold uppercase tracking-wider">Censo Activo</span>
                      </div>
                      <div className="p-5 space-y-4">
                        <div className="grid grid-cols-2 gap-4 text-xs">
                          <div>
                            <p className="text-gray-500 font-bold uppercase text-[9px] mb-1">Contacto Representante</p>
                            <p className="font-medium">{c.nombre_representante}</p>
                            <p className="text-gray-500">{c.telefono_rep} | CI: {c.cedula}</p>
                          </div>
                          <div>
                            <p className="text-gray-500 font-bold uppercase text-[9px] mb-1">Responsable Ruah</p>
                            <p className="font-medium">{c.nombre_encargado_ruah}</p>
                            <p className="text-gray-500">{c.telefono_encargado}</p>
                          </div>
                        </div>

                        <div className="bg-gray-50 p-3 rounded-lg">
                          <p className="text-gray-500 font-bold uppercase text-[9px] mb-2 border-b pb-1">Censo Poblacional</p>
                          <div className="grid grid-cols-3 gap-2 text-center">
                            <div className="p-1"><p className="text-[10px] text-gray-400">Adultos</p><p className="font-bold text-sm">{c.adultos}</p></div>
                            <div className="p-1"><p className="text-[10px] text-gray-400">Mayores</p><p className="font-bold text-sm">{c.adultos_mayores}</p></div>
                            <div className="p-1"><p className="text-[10px] text-gray-400">Niños</p><p className="font-bold text-sm">{c.ninos}</p></div>
                            <div className="p-1"><p className="text-[10px] text-gray-400">Adoles.</p><p className="font-bold text-sm">{c.adolescentes}</p></div>
                            <div className="p-1"><p className="text-[10px] text-gray-400">Embar.</p><p className="font-bold text-sm">{c.embarazadas}</p></div>
                            <div className="p-1"><p className="text-[10px] text-gray-400">Bebés</p><p className="font-bold text-sm">{c.bebes}</p></div>
                          </div>
                          {c.casos_especificos && <p className="mt-2 text-[10px] text-slate-600 bg-white p-2 rounded border italic">Obs: {c.casos_especificos}</p>}
                        </div>

                        {c.mapa_url && (
                          <div className="w-full h-32 rounded-lg overflow-hidden border">
                            <iframe src={c.mapa_url} className="w-full h-full border-0" allowFullScreen loading="lazy"></iframe>
                          </div>
                        )}

                        <button 
                          onClick={() => { setComunidadSeleccionada(c); obtenerNecesidades(c.id); setVistaNecesidades('menu'); setMostrarModalNecesidades(true); }}
                          className="w-full py-2.5 bg-slate-800 text-white rounded-lg text-sm font-semibold hover:bg-slate-900 transition shadow-sm"
                        >
                          📋 Lista de Necesidades
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* MODAL AGREGAR COMUNIDAD (Admin) */}
            {mostrarModalComunidad && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 overflow-y-auto">
                <div className="bg-white rounded-xl p-6 w-full max-w-2xl my-8">
                  <div className="flex justify-between items-center mb-6 border-b pb-4">
                    <h3 className="text-xl font-bold text-slate-800">Registrar Comunidad y Censo</h3>
                    <button onClick={() => setMostrarModalComunidad(false)} className="text-gray-400 hover:text-gray-600">&times;</button>
                  </div>
                  
                  <form onSubmit={guardarComunidad} className="space-y-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="space-y-3 bg-gray-50 p-4 rounded-lg border">
                        <p className="text-[10px] font-bold text-blue-600 uppercase">Datos de Contacto</p>
                        <input type="text" required placeholder="Nombre Representante" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, nombre_representante: e.target.value})} />
                        <input type="text" required placeholder="Cédula" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, cedula: e.target.value})} />
                        <input type="text" required placeholder="Teléfono" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, telefono_rep: e.target.value})} />
                        <hr/>
                        <input type="text" required placeholder="Encargado Proyecto Ruah" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, nombre_encargado_ruah: e.target.value})} />
                        <input type="text" required placeholder="Teléfono Encargado" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, telefono_encargado: e.target.value})} />
                      </div>

                      <div className="space-y-3 bg-gray-50 p-4 rounded-lg border">
                        <p className="text-[10px] font-bold text-blue-600 uppercase">Información Comunidad</p>
                        <input type="text" required placeholder="Nombre Comunidad" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, nombre_comunidad: e.target.value})} />
                        <input type="text" required placeholder="Dirección Escrita" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, direccion: e.target.value})} />
                        <input type="text" placeholder="Iframe Google Maps (URL)" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaComunidad({...nuevaComunidad, mapa_url: e.target.value})} />
                        
                        <div className="grid grid-cols-3 gap-2">
                          <input type="number" placeholder="Adultos" className="border rounded p-2 text-xs" onChange={e => setNuevaComunidad({...nuevaComunidad, adultos: e.target.value})} />
                          <input type="number" placeholder="Mayores" className="border rounded p-2 text-xs" onChange={e => setNuevaComunidad({...nuevaComunidad, adultos_mayores: e.target.value})} />
                          <input type="number" placeholder="Niños" className="border rounded p-2 text-xs" onChange={e => setNuevaComunidad({...nuevaComunidad, ninos: e.target.value})} />
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                          <input type="number" placeholder="Adoles." className="border rounded p-2 text-xs" onChange={e => setNuevaComunidad({...nuevaComunidad, adolescentes: e.target.value})} />
                          <input type="number" placeholder="Embar." className="border rounded p-2 text-xs" onChange={e => setNuevaComunidad({...nuevaComunidad, embarazadas: e.target.value})} />
                          <input type="number" placeholder="Bebés" className="border rounded p-2 text-xs" onChange={e => setNuevaComunidad({...nuevaComunidad, bebes: e.target.value})} />
                        </div>
                      </div>
                    </div>
                    <textarea placeholder="Casos específicos / Observaciones..." className="w-full border rounded p-2 text-sm" rows="3" onChange={e => setNuevaComunidad({...nuevaComunidad, casos_especificos: e.target.value})}></textarea>
                    
                    <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Registrar Comunidad y Censo</button>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL LISTA DE NECESIDADES */}
            {mostrarModalNecesidades && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
                  <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                    <h3 className="font-bold text-sm">Necesidades: {comunidadSeleccionada.nombre_comunidad}</h3>
                    <button onClick={() => setMostrarModalNecesidades(false)}>&times;</button>
                  </div>

                  <div className="p-4">
                    {vistaNecesidades === 'menu' && (
                      <div className="grid grid-cols-2 gap-3">
                        <button onClick={() => setVistaNecesidades('ver')} className="p-6 border rounded-xl hover:bg-blue-50 transition text-center">
                          <div className="text-xl mb-1">👁️</div>
                          <div className="font-bold text-sm">Ver Lista</div>
                        </button>
                        <button onClick={() => setVistaNecesidades('agregar')} className="p-6 border rounded-xl hover:bg-blue-50 transition text-center">
                          <div className="text-xl mb-1">➕</div>
                          <div className="font-bold text-sm">Agregar</div>
                        </button>
                      </div>
                    )}

                    {vistaNecesidades === 'ver' && (
                      <div className="space-y-3">
                        <button onClick={() => setVistaNecesidades('menu')} className="text-[10px] text-blue-600 font-bold mb-2 uppercase">← Volver</button>
                        {necesidades.map(n => (
                          <div key={n.id} className="p-3 border rounded-lg bg-gray-50 flex justify-between items-center">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-slate-800 text-sm">{n.insumo}</span>
                                {n.colaborador && <div className="w-2.5 h-2.5 bg-red-600 rounded-full shadow-sm animate-pulse"></div>}
                              </div>
                              <p className="text-[10px] text-gray-500">Para: {n.nombre_persona}</p>
                              {n.colaborador && <p className="text-[9px] text-blue-700 font-medium">Asignado a: {n.colaborador.nombre}</p>}
                            </div>
                            {!n.colaborador && (
                              <button onClick={() => { setNecesidadActiva(n); setVistaNecesidades('colaborar'); }} className="text-[10px] bg-blue-600 text-white px-2 py-1 rounded font-bold">Colaborar</button>
                            )}
                          </div>
                        ))}
                      </div>
                    )}

                    {vistaNecesidades === 'agregar' && (
                      <form onSubmit={guardarNecesidad} className="space-y-3">
                        <button onClick={() => setVistaNecesidades('menu')} className="text-[10px] text-blue-600 font-bold uppercase">← Cancelar</button>
                        <input type="text" required placeholder="Insumo necesario" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaNecesidad({...nuevaNecesidad, insumo: e.target.value})} />
                        <input type="text" required placeholder="Nombre de la persona" className="w-full border rounded p-2 text-sm" onChange={e => setNuevaNecesidad({...nuevaNecesidad, nombre_persona: e.target.value})} />
                        <textarea placeholder="Nota opcional..." className="w-full border rounded p-2 text-sm" onChange={e => setNuevaNecesidad({...nuevaNecesidad, nota: e.target.value})}></textarea>
                        <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">Guardar Necesidad</button>
                      </form>
                    )}

                    {vistaNecesidades === 'colaborar' && (
                      <form onSubmit={registrarColaboracion} className="space-y-3">
                        <button onClick={() => setVistaNecesidades('ver')} className="text-[10px] text-blue-600 font-bold uppercase">← Atrás</button>
                        <p className="text-xs font-medium text-slate-600">Registrar colaboración para: <span className="font-bold">{necesidadActiva.insumo}</span></p>
                        <input type="text" required placeholder="Tu Nombre" className="w-full border rounded p-2 text-sm" onChange={e => setColaborador({...colaborador, nombre: e.target.value})} />
                        <input type="text" required placeholder="Tu Teléfono" className="w-full border rounded p-2 text-sm" onChange={e => setColaborador({...colaborador, telefono: e.target.value})} />
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-gray-600">¿Eres voluntario Ruah?</span>
                          <select className="border rounded p-1 text-xs" onChange={e => setColaborador({...colaborador, es_voluntario: e.target.value})}>
                            <option>No</option>
                            <option>Sí</option>
                          </select>
                        </div>
                        <button type="submit" className="w-full bg-emerald-600 text-white py-2 rounded font-bold text-sm">Confirmar Colaboración</button>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TICKETS Y RESTO DE SECCIONES (IGUAL AL ORIGINAL) */}
            {seccion === 'tickets' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold text-slate-800">Solicitudes y Casos</h2>
                  <button onClick={() => setMostrarModal(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">+ Registrar Caso</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {['Por revisión', 'Atendiendo', 'Entregado'].map((estadoCol) => (
                    <div key={estadoCol} className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                      <h3 className="font-semibold mb-3 text-slate-700 uppercase text-xs tracking-wider">{estadoCol}</h3>
                      <div className="space-y-3">
                        {tickets.filter(t => t.estado === estadoCol).map(t => (
                          <div key={t.id} className="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                            <h4 className="font-bold text-sm text-gray-800">{t.situacion_caso}</h4>
                            <p className="text-xs text-gray-500">📍 {t.comunidad}</p>
                            <div className="mt-2 pt-2 border-t text-[10px] text-gray-400">⏱️ {calcularTiempoTranscurrido(t.created_at)}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* INVENTARIO (IGUAL AL ORIGINAL) */}
            {seccion === 'inventario' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-bold text-slate-800">Inventario General</h2>
                <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 border-b">
                      <tr><th className="p-4">Recurso / Insumo</th><th className="p-4">Disponibilidad</th></tr>
                    </thead>
                    <tbody className="divide-y">
                      {inventarioPaginado.map(item => (
                        <tr key={item.id}>
                          <td className="p-4 font-medium text-gray-800">{item.item}</td>
                          <td className="p-4">
                            <span className={`px-3 py-1 rounded-full text-xs ${item.cantidad > 2 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                              {item.cantidad > 2 ? 'Disponible' : 'No disponible'}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* MODALES DE LOGIN Y TICKET ORIGINALES */}
            {mostrarLoginAdmin && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-xl p-6 w-full max-w-xs space-y-4 text-center">
                  <h3 className="text-lg font-bold">Acceso Admin</h3>
                  <form onSubmit={loginAdmin} className="space-y-3">
                    <input type="password" placeholder="Contraseña" value={passInput} onChange={e => setPassInput(e.target.value)} className="w-full border rounded p-2 text-sm text-center" />
                    <button type="submit" className="w-full bg-slate-900 text-white rounded py-2 text-sm">Entrar</button>
                    <button type="button" onClick={() => setMostrarLoginAdmin(false)} className="text-xs text-gray-400">Cancelar</button>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
