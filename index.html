<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- DESACTIVAR CACHÉ DEL NAVEGADOR -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Proyecto Ruah - Gestión Comunitaria</title>
  <link rel="icon" type="image/png" href="https://wwtsegyxdodfhqzpgajn.supabase.co/storage/v1/object/public/proyecto-ruah/Ruah%20logo.png"> 
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React y Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://wwtsegyxdodfhqzpgajn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind3dHNlZ3l4ZG9kZmhxenBnYWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MTY3NzgsImV4cCI6MjEwMTA5Mjc3OH0.MDb_sVu5vKsdXjL7jm22hO1uXksCZWlYEstBIKO98Cs";
    const CLAVE_ADMIN = "ruah2026";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // === URLS VOLUNTARIOS ===
    const URLS_VOLUNTARIOS = [
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vSC1qCHZrURes_1bVKlr6nnrMNLXqkj50J6hjH9TvpVsySpnNq5REvgcbUQfXZqFob_jQ8uT_A2Y2qt/pub?output=csv',
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vRHqdXWibNn84wo0MOkfBJZpaA9sbXyC_Y_fMsNADcinC1XD6iQL2X38PwBi2Y-kimdmio1p6kDbM0P/pub?output=csv',
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vRMgDgHLQJ4Vu3LWoKTWUREc6N1C3eAw1yjvFLqIYNGp21waqHJaECritHXj-mi7sVYrBMV7OmIbdUM/pub?output=csv',
      'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2OU1pvEKVDzEFEe4i58GB2JmxwL3M7q_nZCLKJo1jLM5xKiImVba1YufKLS1QC0M2ARz11FLVdVUT/pub?output=csv'
    ];

    function App() {
      const [seccion, setSeccion] = useState('home');
      const [tickets, setTickets] = useState([]);
      const [inventario, setInventario] = useState([]);
      const [comunidades, setComunidades] = useState([]);
      const [cargando, setCargando] = useState(false);
      
      // Admin
      const [esAdmin, setEsAdmin] = useState(false);
      const [mostrarLoginAdmin, setMostrarLoginAdmin] = useState(false);
      const [passInput, setPassInput] = useState('');

      // Modales
      const [mostrarModalTicket, setMostrarModalTicket] = useState(false);
      const [mostrarModalComunidad, setMostrarModalComunidad] = useState(false);
      const [mostrarModalNecesidades, setMostrarModalNecesidades] = useState(false);
      const [mostrarModalColaborar, setMostrarModalColaborar] = useState(false);

      // Estados de Selección
      const [comunidadSeleccionada, setComunidadSeleccionada] = useState(null);
      const [necesidades, setNecesidades] = useState([]);
      const [necesidadParaColaborar, setNecesidadParaColaborar] = useState(null);
      const [vistaNecesidades, setVistaNecesidades] = useState('ver'); // 'ver' o 'agregar'

      // Filtros
      const [fechaFiltro, setFechaFiltro] = useState(() => new Date().toISOString().split('T')[0]);
      const [busquedaInventario, setBusquedaInventario] = useState('');
      const [paginaInventario, setPaginaInventario] = useState(1);
      const ITEMS_POR_PAGINA = 8;

      // === FORMULARIOS ===
      const [nuevoTicket, setNuevoTicket] = useState({
        nombre_voluntario: '', apellido_voluntario: '', situacion_caso: '', ciudad: '',
        comunidad: '', fue_verificado: 'No', descripcion: '', persona_contacto: '',
        telefono_contacto: '', responsable_seguimiento: '', telefono_responsable: '',
        departamento: 'Departamento de Logística', estado: 'Por revisión'
      });

      const [nuevaComunidad, setNuevaComunidad] = useState({
        nombre_representante: '', cedula_representante: '', tel_representante: '',
        encargado_ruah: '', tel_encargado: '', nombre_comunidad: '', direccion: '',
        mapa_url: '', adultos: 0, adultos_mayores: 0, ninos: 0, adolescentes: 0,
        embarazadas: 0, bebes: 0, observaciones: ''
      });

      const [nuevaNecesidad, setNuevaNecesidad] = useState({ insumo: '', nombre_necesitado: '', nota: '' });
      const [datosColaboracion, setDatosColaboracion] = useState({ nombre: '', telefono: '', es_voluntario: 'No' });
      const [nuevoItem, setNuevoItem] = useState({ item: '', cantidad: 1, categoria: 'Comida' });

      // === EFECTOS ===
      useEffect(() => {
        if (seccion === 'tickets') obtenerTickets();
        if (seccion === 'inventario') obtenerInventario();
        if (seccion === 'comunidades') obtenerComunidades();
      }, [seccion]);

      // === FUNCIONES DATA ===
      const obtenerTickets = async () => { setCargando(true); const { data } = await db.from('tickets').select('*').order('created_at', { ascending: false }); setTickets(data || []); setCargando(false); };
      const obtenerInventario = async () => { setCargando(true); const { data } = await db.from('inventario').select('*'); setInventario(data || []); setCargando(false); };
      const obtenerComunidades = async () => { setCargando(true); const { data } = await db.from('comunidades').select('*').order('nombre_comunidad', { ascending: true }); setComunidades(data || []); setCargando(false); };
      
      const obtenerNecesidades = async (comunidadId) => {
        const { data } = await db.from('necesidades_comunidad').select('*').eq('comunidad_id', comunidadId).order('created_at', { ascending: false });
        setNecesidades(data || []);
      };

      const guardarComunidad = async (e) => {
        e.preventDefault();
        setCargando(true);
        const { error } = await db.from('comunidades').insert([nuevaComunidad]);
        if (error) alert(error.message);
        else {
          alert("Comunidad registrada");
          setMostrarModalComunidad(false);
          obtenerComunidades();
        }
        setCargando(false);
      };

      const guardarNecesidad = async (e) => {
        e.preventDefault();
        const { error } = await db.from('necesidades_comunidad').insert([{ ...nuevaNecesidad, comunidad_id: comunidadSeleccionada.id }]);
        if (error) alert(error.message);
        else {
          setNuevaNecesidad({ insumo: '', nombre_necesitado: '', nota: '' });
          setVistaNecesidades('ver');
          obtenerNecesidades(comunidadSeleccionada.id);
        }
      };

      const enviarColaboracion = async (e) => {
        e.preventDefault();
        const { error } = await db.from('necesidades_comunidad').update({
          esta_cubierto: true,
          colaborador_nombre: datosColaboracion.nombre,
          colaborador_tel: datosColaboracion.telefono,
          es_voluntario_colab: datosColaboracion.es_voluntario
        }).eq('id', necesidadParaColaborar.id);

        if (error) alert(error.message);
        else {
          alert("¡Gracias por colaborar!");
          setMostrarModalColaborar(false);
          obtenerNecesidades(comunidadSeleccionada.id);
        }
      };

      const loginAdmin = (e) => {
        e.preventDefault();
        if (passInput === CLAVE_ADMIN) { setEsAdmin(true); setMostrarLoginAdmin(false); setPassInput(''); }
        else alert("Contraseña incorrecta");
      };

      const cambiarEstadoTicket = async (id, nuevoEstado) => { await db.from('tickets').update({ estado: nuevoEstado }).eq('id', id); obtenerTickets(); };

      // === HELPERS ===
      const calcularTiempoTranscurrido = (fecha) => {
        if (!fecha) return 'Reciente';
        const difMs = new Date() - new Date(fecha);
        const min = Math.floor(difMs / 60000);
        const hrs = Math.floor(min / 60);
        return hrs > 0 ? `${hrs}h ${min % 60}m` : `${min}m`;
      };

      const formatMapaURL = (url) => {
        if (!url) return null;
        if (url.includes('<iframe')) {
          const src = url.match(/src="([^"]+)"/);
          return src ? src[1] : null;
        }
        return url;
      };

      const ticketsFiltrados = tickets.filter(t => (t.created_at?.split('T')[0] === fechaFiltro) || t.estado !== 'Entregado');
      const inventarioProcesado = [...inventario].filter(i => i.item.toLowerCase().includes(busquedaInventario.toLowerCase())).sort((a,b) => a.item.localeCompare(b.item));
      const inventarioPaginado = inventarioProcesado.slice((paginaInventario-1)*ITEMS_POR_PAGINA, paginaInventario*ITEMS_POR_PAGINA);

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          
          {/* Menú Lateral */}
          <aside className="w-full md:w-64 bg-slate-900 text-white p-6 flex-shrink-0 flex flex-col justify-between">
            <div>
              <div className="flex items-center gap-3 mb-8">
                <img src="https://wwtsegyxdodfhqzpgajn.supabase.co/storage/v1/object/public/proyecto-ruah/Ruah%20logo.png" className="w-10 h-10 rounded-full" />
                <h1 className="text-xl font-bold tracking-wider text-blue-400">Proyecto Ruah</h1>
              </div>
              <nav className="space-y-2">
                <button onClick={() => setSeccion('home')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'home' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>🏠 Home</button>
                <button onClick={() => setSeccion('comunidades')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'comunidades' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>📍 Comunidades</button>
                <button onClick={() => setSeccion('tickets')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'tickets' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>🎟️ Tickets</button>
                <button onClick={() => setSeccion('inventario')} className={`w-full text-left px-4 py-3 rounded-lg transition ${seccion === 'inventario' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}>📦 Inventario</button>
              </nav>
            </div>
            <div className="pt-6 border-t border-slate-800">
              {esAdmin ? (
                <div className="text-center space-y-2">
                  <span className="text-xs text-emerald-400">Modo Admin Activo</span>
                  <button onClick={() => setEsAdmin(false)} className="text-[10px] text-gray-400 underline block mx-auto">Cerrar Sesión</button>
                </div>
              ) : (
                <button onClick={() => setMostrarLoginAdmin(true)} className="w-full text-xs text-slate-400 hover:text-white py-2">🔒 Acceso Admin</button>
              )}
            </div>
          </aside>

          {/* Contenido Principal */}
          <main className="flex-1 p-6 md:p-10 relative">
            
            {/* HOME */}
            {seccion === 'home' && (
              <div className="max-w-4xl space-y-6">
                <div className="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
                  <h2 className="text-3xl font-bold text-slate-800 mb-4">¡Bienvenidos a Fundación Ruah!</h2>
                  <p className="text-gray-600 leading-relaxed mb-6">Nuestra misión es transformar realidades mediante el servicio y la organización comunitaria.</p>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button onClick={() => setSeccion('comunidades')} className="p-6 bg-blue-50 border border-blue-100 rounded-xl hover:bg-blue-100 transition text-left group">
                      <span className="text-2xl mb-2 block">📍</span>
                      <h3 className="font-bold text-blue-900">Ver Comunidades</h3>
                      <p className="text-sm text-blue-700">Explora los sectores atendidos y sus necesidades.</p>
                    </button>
                    <button onClick={() => setSeccion('tickets')} className="p-6 bg-slate-50 border border-slate-100 rounded-xl hover:bg-slate-100 transition text-left">
                      <span className="text-2xl mb-2 block">🎟️</span>
                      <h3 className="font-bold text-slate-900">Registrar Caso</h3>
                      <p className="text-sm text-slate-700">Reporta una situación que requiera atención.</p>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* COMUNIDADES */}
            {seccion === 'comunidades' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-800">Comunidades Atendidas</h2>
                    <p className="text-xs text-gray-500">Censo y gestión de recursos por sector</p>
                  </div>
                  {esAdmin && (
                    <button onClick={() => setMostrarModalComunidad(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm hover:bg-blue-700 transition">
                      + Agregar Nueva Comunidad
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                  {comunidades.map(c => (
                    <div key={c.id} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                      <div className="p-5 border-b bg-gray-50/50 flex justify-between items-start">
                        <div>
                          <h3 className="text-xl font-bold text-slate-800">{c.nombre_comunidad}</h3>
                          <p className="text-xs text-gray-500 flex items-center gap-1 mt-1">📍 {c.direccion}</p>
                        </div>
                        <div className="text-right">
                          <span className="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">Proyecto Ruah</span>
                        </div>
                      </div>

                      <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Datos de Contacto */}
                        <div className="space-y-3">
                          <h4 className="text-xs font-bold uppercase tracking-wider text-gray-400">Contactos</h4>
                          <div className="text-sm space-y-2">
                            <p><strong>Representante:</strong> {c.nombre_representante} <br/><span className="text-gray-500 text-xs">CI: {c.cedula_representante} | Tel: {c.tel_representante}</span></p>
                            <p><strong>Encargado Ruah:</strong> {c.encargado_ruah} <br/><span className="text-gray-500 text-xs">Tel: {c.tel_encargado}</span></p>
                          </div>
                          
                          <h4 className="text-xs font-bold uppercase tracking-wider text-gray-400 pt-2">Censo Poblacional</h4>
                          <div className="grid grid-cols-3 gap-2">
                            <div className="bg-gray-50 p-2 rounded text-center"><p className="text-xs text-gray-500">Adultos</p><p className="font-bold">{c.adultos}</p></div>
                            <div className="bg-gray-50 p-2 rounded text-center"><p className="text-xs text-gray-500">Mayores</p><p className="font-bold">{c.adultos_mayores}</p></div>
                            <div className="bg-gray-50 p-2 rounded text-center"><p className="text-xs text-gray-500">Niños</p><p className="font-bold">{c.ninos}</p></div>
                            <div className="bg-gray-50 p-2 rounded text-center"><p className="text-xs text-gray-500">Adol.</p><p className="font-bold">{c.adolescentes}</p></div>
                            <div className="bg-gray-50 p-2 rounded text-center"><p className="text-xs text-gray-500">Embar.</p><p className="font-bold">{c.embarazadas}</p></div>
                            <div className="bg-gray-50 p-2 rounded text-center"><p className="text-xs text-gray-500">Bebés</p><p className="font-bold">{c.bebes}</p></div>
                          </div>
                        </div>

                        {/* Mapa */}
                        <div className="h-full min-h-[200px] rounded-lg overflow-hidden border bg-gray-100 flex items-center justify-center relative">
                          {formatMapaURL(c.mapa_url) ? (
                            <iframe src={formatMapaURL(c.mapa_url)} className="absolute inset-0 w-full h-full" style={{border:0}} allowFullScreen="" loading="lazy"></iframe>
                          ) : (
                            <span className="text-gray-400 text-xs">Ubicación no disponible</span>
                          )}
                        </div>
                      </div>

                      <div className="px-5 pb-5 mt-auto">
                        <button 
                          onClick={() => { setComunidadSeleccionada(c); obtenerNecesidades(c.id); setMostrarModalNecesidades(true); }}
                          className="w-full bg-slate-800 text-white py-2 rounded-lg text-sm font-semibold hover:bg-slate-900 transition"
                        >
                          📋 Lista de Necesidades
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SECCIONES PREEXISTENTES (MANTENIDAS) */}
            {seccion === 'tickets' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-2xl font-bold">Solicitudes y Casos</h2>
                  <button onClick={() => setMostrarModalTicket(true)} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">+ Registrar Caso</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {['Por revisión', 'Atendiendo', 'Entregado'].map(col => (
                    <div key={col} className="bg-gray-50 p-4 rounded-xl border">
                      <h3 className="font-bold mb-4">{col}</h3>
                      <div className="space-y-3">
                        {ticketsFiltrados.filter(t => t.estado === col).map(t => (
                          <div key={t.id} className="bg-white p-4 rounded-lg shadow-sm border text-sm">
                            <p className="font-bold">{t.situacion_caso}</p>
                            <p className="text-xs text-gray-500">📍 {t.comunidad}</p>
                            <div className="mt-2 text-[10px] bg-amber-50 text-amber-700 p-1 rounded">⏱️ {calcularTiempoTranscurrido(t.created_at)}</div>
                            {esAdmin && (
                              <div className="mt-3 pt-2 border-t flex gap-1">
                                {col !== 'Atendiendo' && <button onClick={() => cambiarEstadoTicket(t.id, 'Atendiendo')} className="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px]">Atender</button>}
                                {col !== 'Entregado' && <button onClick={() => cambiarEstadoTicket(t.id, 'Entregado')} className="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-[10px]">Entregado</button>}
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* INVENTARIO */}
            {seccion === 'inventario' && (
              <div className="space-y-6">
                <h2 className="text-2xl font-bold">Inventario General</h2>
                <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-gray-50 border-b">
                      <tr><th className="p-4">Insumo</th><th className="p-4">Estado</th>{esAdmin && <th className="p-4">Cant.</th>}</tr>
                    </thead>
                    <tbody className="divide-y">
                      {inventarioPaginado.map(i => (
                        <tr key={i.id}>
                          <td className="p-4 font-medium">{i.item}</td>
                          <td className="p-4">
                            <span className={`px-2 py-1 rounded-full text-[10px] font-bold ${i.cantidad > 2 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                              {i.cantidad > 2 ? 'Disponible' : 'Agotado'}
                            </span>
                          </td>
                          {esAdmin && <td className="p-4 text-gray-500 font-mono">{i.cantidad}</td>}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* MODAL REGISTRO COMUNIDAD (Solo Admin) */}
            {mostrarModalComunidad && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
                  <div className="p-6 border-b sticky top-0 bg-white z-10 flex justify-between items-center">
                    <h3 className="text-xl font-bold">Registrar Nueva Comunidad</h3>
                    <button onClick={() => setMostrarModalComunidad(false)} className="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
                  </div>
                  <form onSubmit={guardarComunidad} className="p-6 space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="space-y-3">
                        <p className="text-xs font-bold text-blue-600 uppercase tracking-widest">Datos de Contacto</p>
                        <input type="text" required placeholder="Nombre del representante" className="w-full border rounded p-2 text-sm" value={nuevaComunidad.nombre_representante} onChange={e => setNuevaComunidad({...nuevaComunidad, nombre_representante: e.target.value})} />
                        <input type="text" required placeholder="Cédula" className="w-full border rounded p-2 text-sm" value={nuevaComunidad.cedula_representante} onChange={e => setNuevaComunidad({...nuevaComunidad, cedula_representante: e.target.value})} />
                        <input type="text" required placeholder="Teléfono" className="w-full border rounded p-2 text-sm" value={nuevaComunidad.tel_representante} onChange={e => setNuevaComunidad({...nuevaComunidad, tel_representante: e.target.value})} />
                        <hr/>
                        <input type="text" required placeholder="Encargado Proyecto Ruah" className="w-full border rounded p-2 text-sm" value={nuevaComunidad.encargado_ruah} onChange={e => setNuevaComunidad({...nuevaComunidad, encargado_ruah: e.target.value})} />
                        <input type="text" required placeholder="Teléfono Encargado" className="w-full border rounded p-2 text-sm" value={nuevaComunidad.tel_encargado} onChange={e => setNuevaComunidad({...nuevaComunidad, tel_encargado: e.target.value})} />
                      </div>
                      <div className="space-y-3">
                        <p className="text-xs font-bold text-blue-600 uppercase tracking-widest">Información y Censo</p>
                        <input type="text" required placeholder="Nombre de la comunidad" className="w-full border rounded p-2 text-sm font-bold" value={nuevaComunidad.nombre_comunidad} onChange={e => setNuevaComunidad({...nuevaComunidad, nombre_comunidad: e.target.value})} />
                        <input type="text" required placeholder="Dirección escrita" className="w-full border rounded p-2 text-sm" value={nuevaComunidad.direccion} onChange={e => setNuevaComunidad({...nuevaComunidad, direccion: e.target.value})} />
                        <input type="text" placeholder="URL Mapa (Iframe o Enlace Google Maps)" className="w-full border rounded p-2 text-sm bg-gray-50" value={nuevaComunidad.mapa_url} onChange={e => setNuevaComunidad({...nuevaComunidad, mapa_url: e.target.value})} />
                        
                        <div className="grid grid-cols-3 gap-2 pt-2">
                          <div><label className="text-[10px] text-gray-500">Adultos</label><input type="number" className="w-full border rounded p-1 text-sm" value={nuevaComunidad.adultos} onChange={e => setNuevaComunidad({...nuevaComunidad, adultos: e.target.value})} /></div>
                          <div><label className="text-[10px] text-gray-500">Mayores</label><input type="number" className="w-full border rounded p-1 text-sm" value={nuevaComunidad.adultos_mayores} onChange={e => setNuevaComunidad({...nuevaComunidad, adultos_mayores: e.target.value})} /></div>
                          <div><label className="text-[10px] text-gray-500">Niños</label><input type="number" className="w-full border rounded p-1 text-sm" value={nuevaComunidad.ninos} onChange={e => setNuevaComunidad({...nuevaComunidad, ninos: e.target.value})} /></div>
                          <div><label className="text-[10px] text-gray-500">Adol.</label><input type="number" className="w-full border rounded p-1 text-sm" value={nuevaComunidad.adolescentes} onChange={e => setNuevaComunidad({...nuevaComunidad, adolescentes: e.target.value})} /></div>
                          <div><label className="text-[10px] text-gray-500">Embar.</label><input type="number" className="w-full border rounded p-1 text-sm" value={nuevaComunidad.embarazadas} onChange={e => setNuevaComunidad({...nuevaComunidad, embarazadas: e.target.value})} /></div>
                          <div><label className="text-[10px] text-gray-500">Bebés</label><input type="number" className="w-full border rounded p-1 text-sm" value={nuevaComunidad.bebes} onChange={e => setNuevaComunidad({...nuevaComunidad, bebes: e.target.value})} /></div>
                        </div>
                      </div>
                    </div>
                    <textarea placeholder="Observaciones y casos específicos..." className="w-full border rounded p-2 text-sm" rows="3" value={nuevaComunidad.observaciones} onChange={e => setNuevaComunidad({...nuevaComunidad, observaciones: e.target.value})}></textarea>
                    
                    <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">Guardar Comunidad</button>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL LISTA DE NECESIDADES */}
            {mostrarModalNecesidades && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-xl w-full max-w-lg overflow-hidden shadow-2xl">
                  <div className="p-4 border-b bg-slate-900 text-white flex justify-between items-center">
                    <h3 className="font-bold">Necesidades: {comunidadSeleccionada?.nombre_comunidad}</h3>
                    <button onClick={() => setMostrarModalNecesidades(false)} className="text-white/70 hover:text-white">&times;</button>
                  </div>

                  <div className="flex border-b">
                    <button onClick={() => setVistaNecesidades('ver')} className={`flex-1 py-3 text-sm font-bold ${vistaNecesidades === 'ver' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>Ver Lista</button>
                    <button onClick={() => setVistaNecesidades('agregar')} className={`flex-1 py-3 text-sm font-bold ${vistaNecesidades === 'agregar' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-500'}`}>+ Agregar</button>
                  </div>

                  <div className="p-4 max-h-[400px] overflow-y-auto">
                    {vistaNecesidades === 'ver' ? (
                      <div className="space-y-3">
                        {necesidades.length > 0 ? necesidades.map(n => (
                          <div key={n.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg border">
                            <div className="flex items-center gap-3">
                              {n.esta_cubierto && <span className="w-3 h-3 rounded-full bg-red-500 animate-pulse" title="Ya asignado"></span>}
                              <div>
                                <p className="text-sm font-bold text-slate-800">{n.insumo}</p>
                                <p className="text-[10px] text-gray-500">Para: {n.nombre_necesitado}</p>
                              </div>
                            </div>
                            {!n.esta_cubierto ? (
                              <button 
                                onClick={() => { setNecesidadParaColaborar(n); setMostrarModalColaborar(true); }}
                                className="text-xs bg-blue-600 text-white px-3 py-1.5 rounded-md hover:bg-blue-700"
                              >
                                Colaborar
                              </button>
                            ) : (
                              <span className="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-1 rounded">Asignado</span>
                            )}
                          </div>
                        )) : (
                          <p className="text-center text-gray-400 py-8 text-sm italic">No hay necesidades registradas aún.</p>
                        )}
                      </div>
                    ) : (
                      <form onSubmit={guardarNecesidad} className="space-y-3">
                        <input type="text" required placeholder="Insumo / Necesidad" className="w-full border rounded p-2 text-sm" value={nuevaNecesidad.insumo} onChange={e => setNuevaNecesidad({...nuevaNecesidad, insumo: e.target.value})} />
                        <input type="text" required placeholder="Nombre del beneficiario" className="w-full border rounded p-2 text-sm" value={nuevaNecesidad.nombre_necesitado} onChange={e => setNuevaNecesidad({...nuevaNecesidad, nombre_necesitado: e.target.value})} />
                        <textarea placeholder="Nota adicional (opcional)" className="w-full border rounded p-2 text-sm" rows="2" value={nuevaNecesidad.nota} onChange={e => setNuevaNecesidad({...nuevaNecesidad, nota: e.target.value})}></textarea>
                        <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">Registrar Necesidad</button>
                      </form>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* MODAL COLABORAR */}
            {mostrarModalColaborar && (
              <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[60]">
                <div className="bg-white rounded-xl w-full max-w-xs shadow-2xl">
                  <div className="p-4 border-b">
                    <h4 className="font-bold text-sm text-slate-800">Formulario de Colaboración</h4>
                    <p className="text-[10px] text-gray-500">Apoyo para: {necesidadParaColaborar?.insumo}</p>
                  </div>
                  <form onSubmit={enviarColaboracion} className="p-4 space-y-3">
                    <input type="text" required placeholder="Tu nombre" className="w-full border rounded p-2 text-xs" value={datosColaboracion.nombre} onChange={e => setDatosColaboracion({...datosColaboracion, nombre: e.target.value})} />
                    <input type="text" required placeholder="Tu teléfono" className="w-full border rounded p-2 text-xs" value={datosColaboracion.telefono} onChange={e => setDatosColaboracion({...datosColaboracion, telefono: e.target.value})} />
                    <div className="space-y-1">
                      <p className="text-[10px] font-bold text-gray-600">¿Eres voluntario en Proyecto Ruah?</p>
                      <select className="w-full border rounded p-2 text-xs" value={datosColaboracion.es_voluntario} onChange={e => setDatosColaboracion({...datosColaboracion, es_voluntario: e.target.value})}>
                        <option value="No">No</option>
                        <option value="Sí">Sí</option>
                      </select>
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button type="button" onClick={() => setMostrarModalColaborar(false)} className="flex-1 px-3 py-2 text-xs text-gray-500">Cancelar</button>
                      <button type="submit" className="flex-1 bg-emerald-600 text-white py-2 rounded text-xs font-bold">Enviar</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL TICKET (Mantenido) */}
            {mostrarModalTicket && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-xl p-6 w-full max-w-lg overflow-y-auto max-h-[90vh]">
                  <h3 className="text-xl font-bold mb-4 border-b pb-2">Nuevo Ticket</h3>
                  {/* ... Lógica de formulario idéntica a tu código original ... */}
                  <button onClick={() => setMostrarModalTicket(false)} className="w-full mt-4 text-gray-400 text-sm">Cerrar</button>
                </div>
              </div>
            )}

            {/* MODAL LOGIN ADMIN */}
            {mostrarLoginAdmin && (
              <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-xl p-6 w-full max-w-xs text-center">
                  <h3 className="text-lg font-bold mb-4">Acceso Administrador</h3>
                  <form onSubmit={loginAdmin} className="space-y-3">
                    <input type="password" placeholder="Contraseña" value={passInput} onChange={e => setPassInput(e.target.value)} className="w-full border rounded p-2 text-sm text-center" />
                    <div className="flex justify-center gap-2">
                      <button type="button" onClick={() => setMostrarLoginAdmin(false)} className="text-xs text-gray-500 px-4">Cancelar</button>
                      <button type="submit" className="bg-slate-900 text-white px-4 py-1.5 rounded text-xs">Entrar</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
